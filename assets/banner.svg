<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Manoel Gustavo — Recursos Humanos, Produto, Projetos, Agilidade e People Analytics</title>
  <desc id="desc">Banner minimalista da identidade visual de Manoel Gustavo em branco, vermelho, verde lima e preto.</desc>

  <rect width="1600" height="480" fill="#ffffff"/>

  <!-- elementos gráficos minimalistas -->
  <path d="M0 0H242C216 82 178 133 114 169C72 193 34 204 0 211Z" fill="#ffffff"/>
  <path d="M0 0H225C205 72 172 117 116 150C77 173 39 184 0 190Z" fill="none" stroke="#c71717" stroke-width="3"/>
  <circle cx="243" cy="54" r="13" fill="#c71717"/>

  <path d="M1600 282C1563 295 1524 322 1494 359C1465 395 1447 434 1439 480" fill="none" stroke="#171717" stroke-width="3"/>
  <circle cx="1528" cy="361" r="15" fill="#8fff00"/>

  <!-- nome -->
  <text x="800" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" fill="#111111">
    Manoel <tspan fill="#c71717">Gustavo</tspan>
  </text>

  <!-- headline -->
  <text x="800" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#181818">
    Recursos Humanos <tspan fill="#c71717">•</tspan> Produto <tspan fill="#c71717">•</tspan> Projetos <tspan fill="#c71717">•</tspan> Agilidade <tspan fill="#c71717">•</tspan> People Analytics
  </text>

  <!-- acentos da IDV -->
  <rect x="724" y="266" width="60" height="4" rx="2" fill="#c71717"/>
  <rect x="798" y="266" width="60" height="4" rx="2" fill="#8fff00"/>

  <!-- subtexto -->
  <text x="800" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1.4" fill="#606060">
    Processos estruturados, produtos digitais e decisões orientadas por dados.
  </text>
</svg>